{% extends "base.html" %}

{% block title %}
    Update Notes
{% endblock %}

{% block navmenu %}
    <a href="/dashboard">Home</a>
    <a href="#">Files</a>
    <a href="/dashboard/notes">Notes</a>
    <a href="#">Profile</a>
    <a href="/logout">Logout</a>
{% endblock %}

{% block content %}

<div style="text-align: center;">

    <h2>SNS Update Notes</h2>

    <p>Here you can update notes.</p>

    <form action="{{ url_for('edit_notes', notesid=id) }}" method="POST">

        <div>
            <label for="title">Title</label>
            <input
                type="text" 
                name="title" id=""  value="{{ title }}">
        </div>

        <br>

        <div>
            <label for="content">Content</label>
            <br>
            <textarea
             name="content"
                rows="6" cols="40"
                id="">{{ content }}</textarea>
        </div>

        <br>

        <button type="submit">Submit</button>

    </form>

</div>

{% endblock %}
